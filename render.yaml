# CareerPilot — full stack Render Blueprint (backend + AI API)
# Deploy: https://dashboard.render.com → New → Blueprint → connect this repo
services:
  - type: web
    name: careerpilot-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_CALLBACK_URL
        sync: false

  - type: web
    name: careerpilot-ai
    runtime: python
    rootDir: ai-models
    plan: free
    buildCommand: pip install -r requirements-prod.txt
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker cv_agent.app.api:app --bind 0.0.0.0:$PORT --timeout 300
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: JWT_SECRET
        fromService:
          name: careerpilot-backend
          type: web
          envVarKey: JWT_SECRET
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MODAL_ENDPOINT_URL
        sync: false
      - key: MODAL_PROFILE
        value: essamalaa0355
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HUGGINGFACE_TOKEN
        sync: false
      - key: ALLOW_MODEL_DOWNLOAD
        value: "false"
      - key: CV_WARMUP_MODEL
        value: "false"
      - key: USE_PHI3_WRITER
        value: "false"
      - key: CV_AGENT_AUTH_DISABLED
        value: "false"
      - key: MODEL_PRELOAD_MODE
        value: "none"
      - key: RELOAD
        value: "false"
