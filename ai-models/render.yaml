# Render Blueprint — CareerPilot AI API (API-only: Modal + Gemini + Groq)
# Deploy: connect repo at https://dashboard.render.com → New → Blueprint → select this file
services:
  - type: web
    name: careerpilot-ai
    runtime: python
    rootDir: ai-models
    plan: free
    buildCommand: pip install -r requirements-prod.txt
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker cv_agent.app.api:app --bind 0.0.0.0:$PORT --timeout 300
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MODAL_ENDPOINT_URL
        sync: false
      - key: MODAL_PROFILE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HUGGINGFACE_TOKEN
        sync: false
      - key: ALLOW_MODEL_DOWNLOAD
        value: "false"
      - key: CV_WARMUP_MODEL
        value: "false"
      - key: USE_PHI3_WRITER
        value: "false"
      - key: CV_AGENT_AUTH_DISABLED
        value: "false"
      - key: MODEL_PRELOAD_MODE
        value: "none"
      - key: RELOAD
        value: "false"
