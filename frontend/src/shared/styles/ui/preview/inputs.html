<!doctype html>
<html><head><meta charset="utf-8"><title>Form inputs</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 20px 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; }
  .field label { display:block; font-size:12px; color:#57534A; margin-bottom:6px; font-weight:500; }
  .input, .textarea, .select {
    width: 100%; font-family: var(--font-sans); font-size: 14px; color: #1B1A16;
    background: #fff; border: 1px solid #D9D0BB; border-radius: 6px;
    padding: 9px 12px; box-shadow: inset 0 1px 2px rgba(40,30,15,.04); line-height: 1.3;
  }
  .input:focus, .textarea:focus { outline: none; border-color: #3C6240; box-shadow: 0 0 0 3px rgba(60,98,64,.25); }
  .input.error { border-color: #B5432B; box-shadow: 0 0 0 3px rgba(181,67,43,.18); }
  .hint { font-size: 11px; color: #8A8478; margin-top: 5px; }
  .hint.err { color: #B5432B; }
  .toggle { width: 36px; height: 20px; background: #D6C8A1; border-radius: 999px; position: relative; cursor: pointer; }
  .toggle::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; background:#fff; border-radius:50%; box-shadow:0 1px 2px rgba(0,0,0,.2); transition: left .15s; }
  .toggle.on { background: #3C6240; }
  .toggle.on::after { left: 18px; }
  .check { width: 18px; height: 18px; border: 1.5px solid #B8A87F; border-radius: 4px; display: inline-block; vertical-align: middle; }
  .check.on { background: #3C6240; border-color: #3C6240; position: relative; }
  .check.on::after { content:""; position:absolute; left:4px; top:1px; width:6px; height:10px; border:solid #fff; border-width:0 2px 2px 0; transform: rotate(45deg); }
  .row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
</style></head>
<body>
  <div class="grid">
    <div class="field">
      <label>Full name</label>
      <input class="input" value="Maya Hernandez">
    </div>
    <div class="field">
      <label>Target role</label>
      <input class="input" placeholder="e.g. Senior Product Designer">
    </div>
    <div class="field">
      <label>Email</label>
      <input class="input error" value="maya@acme">
      <div class="hint err">Please enter a complete email address.</div>
    </div>
    <div class="field">
      <label>Experience level</label>
      <select class="select"><option>Mid-level · 4–7 yrs</option></select>
    </div>
    <div class="field" style="grid-column: span 2">
      <label>Summary</label>
      <textarea class="textarea" rows="2">Product designer focused on tools that earn user trust through clarity.</textarea>
    </div>
    <div class="row"><span class="check on"></span> Open to remote roles</div>
    <div class="row"><div class="toggle on"></div> Notify me about new matches</div>
  </div>
</body></html>
