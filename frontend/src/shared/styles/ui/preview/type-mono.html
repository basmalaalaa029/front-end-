<!doctype html>
<html><head><meta charset="utf-8"><title>Mono &amp; numerics</title>
<link rel="stylesheet" href="_card.css">
<style>
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-tertiary); font-weight: 600; margin-bottom: 6px; }
  .stat-row { display: flex; gap: 28px; align-items: baseline; }
  .stat .n { font-family: var(--font-mono); font-size: 38px; font-weight: 500; color: var(--moss-700); letter-spacing: -0.02em; }
  .stat .l { font-size: 12px; color: var(--fg-secondary); margin-top: 2px; }
  .code {
    font-family: var(--font-mono); font-size: 13px; background: #F4EFE2; border: 1px solid #ECE5D4;
    border-radius: 6px; padding: 10px 14px; color: #2F4D33;
  }
  kbd {
    font-family: var(--font-mono); background: #fff; border: 1px solid #D9D0BB;
    border-bottom-width: 2px; border-radius: 4px; padding: 2px 7px; font-size: 12px; color: #57534A;
  }
</style></head>
<body>
  <div class="stack">
    <div>
      <div class="label">Tabular numerics — Geist Mono</div>
      <div class="stat-row">
        <div class="stat"><div class="n">87</div><div class="l">Match score</div></div>
        <div class="stat"><div class="n">$142k</div><div class="l">Median salary</div></div>
        <div class="stat"><div class="n">12</div><div class="l">Applications</div></div>
        <div class="stat"><div class="n">3.4×</div><div class="l">Reply rate</div></div>
      </div>
    </div>
    <div>
      <div class="label">Code &amp; hotkeys</div>
      <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
        <span class="code">match_score = 0.87</span>
        <span><kbd>⌘</kbd> <kbd>K</kbd></span>
        <span><kbd>Tab</kbd> to accept</span>
      </div>
    </div>
  </div>
</body></html>
