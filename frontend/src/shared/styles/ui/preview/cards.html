<!doctype html>
<html><head><meta charset="utf-8"><title>Cards</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 20px 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { background:#fff; border:1px solid #ECE5D4; border-radius:10px; padding:18px; box-shadow: 0 1px 3px rgba(40,30,15,.05); }
  .card.ai { background: #FBF9F1; border-color: #E2D9BD; }
  .card-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .title { font-size:15px; font-weight:600; letter-spacing:-0.01em; }
  .meta { font-size:12px; color:#8A8478; }
  .body { font-size:13px; color:#57534A; line-height:1.55; }
  .row { display:flex; gap:8px; margin-top:12px; align-items:center; }
  .badge { font-size:11px; padding:2px 8px; border-radius:999px; background:#DEE9DC; color:#2F4D33; font-weight:500; }
  .ai-mark { display:inline-flex; gap:6px; font-size:11px; color:#2F4D33; font-weight:600; align-items:center; }
  .ai-mark svg { width:11px; height:11px; stroke:currentColor; fill:none; stroke-width:2; }
  .avatar { width:34px; height:34px; border-radius:8px; background:#3C6240; color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; }
</style></head>
<body>
  <div class="grid">
    <div class="card">
      <div class="card-head">
        <div style="display:flex;gap:10px;align-items:center;">
          <div class="avatar">SF</div>
          <div>
            <div class="title">Senior Product Designer</div>
            <div class="meta">Stripe · Remote · $180k–220k</div>
          </div>
        </div>
        <span class="badge">92% match</span>
      </div>
      <div class="body">Strong fit on design systems, payments UX, and senior IC experience.</div>
    </div>

    <div class="card ai">
      <div class="ai-mark">
        <svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4"/></svg>
        Copilot suggestion
      </div>
      <div class="title" style="margin-top:8px">Sharpen your summary</div>
      <div class="body" style="margin-top:6px">Lead with measurable outcomes — try "Shipped 14 features that cut onboarding time 38%."</div>
      <div class="row">
        <button style="font-size:12px;padding:5px 10px;border-radius:5px;background:#3C6240;color:#fff;border:0;font-weight:500">Apply suggestion</button>
        <button style="font-size:12px;padding:5px 10px;border-radius:5px;background:transparent;color:#57534A;border:0">Dismiss</button>
      </div>
    </div>
  </div>
</body></html>
