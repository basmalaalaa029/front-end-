<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing in use</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { padding: 22px 24px; }
  .card { background:#fff; border:1px solid #ECE5D4; border-radius:10px; padding:20px; max-width:480px; }
  .head { display:flex; gap:14px; align-items:center; padding-bottom:16px; border-bottom: 1px solid #ECE5D4; margin-bottom:16px; }
  .av { width:44px; height:44px; border-radius:10px; background:#3C6240; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; }
  .name { font-weight:600; font-size:15px; }
  .role { font-size:12px; color:#8A8478; margin-top:2px; }
  .stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .stat .n { font-family:var(--font-mono); font-size:20px; color:#2F4D33; font-weight:500; }
  .stat .l { font-size:11px; color:#8A8478; text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }
  .note { font-size:11px; color:#8A8478; text-transform:uppercase; letter-spacing:.08em; }
  .ann { position: relative; }
  .ann::before { content: attr(data-tok); position:absolute; right:-90px; top:50%; transform:translateY(-50%); font-family:var(--font-mono); font-size:10px; color:#A86A41; }
</style></head>
<body>
  <div style="display:flex; gap:48px; align-items:flex-start;">
    <div>
      <div class="note" style="margin-bottom:10px">Spacing 6 · 4 · 5 — readable rhythm</div>
      <div class="card">
        <div class="head">
          <div class="av">MH</div>
          <div>
            <div class="name">Maya Hernandez</div>
            <div class="role">Senior Product Designer</div>
          </div>
        </div>
        <div class="stats">
          <div class="stat"><div class="n">87</div><div class="l">Match</div></div>
          <div class="stat"><div class="n">12</div><div class="l">Applied</div></div>
          <div class="stat"><div class="n">3</div><div class="l">Interviews</div></div>
        </div>
      </div>
    </div>
  </div>
</body></html>
