<!doctype html>
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .item { text-align: center; }
  .box { width: 78px; height: 78px; background: #F4EFE2; border: 1px solid #D9D0BB; }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--fg-secondary); margin-top: 8px; }
  .px { font-family: var(--font-mono); font-size: 10px; color: var(--fg-tertiary); }
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:2px"></div><div class="tok">xs</div><div class="px">2</div></div>
    <div class="item"><div class="box" style="border-radius:4px"></div><div class="tok">sm</div><div class="px">4</div></div>
    <div class="item"><div class="box" style="border-radius:6px"></div><div class="tok">md</div><div class="px">6</div></div>
    <div class="item"><div class="box" style="border-radius:10px"></div><div class="tok">lg</div><div class="px">10</div></div>
    <div class="item"><div class="box" style="border-radius:14px"></div><div class="tok">xl</div><div class="px">14</div></div>
    <div class="item"><div class="box" style="border-radius:20px"></div><div class="tok">2xl</div><div class="px">20</div></div>
    <div class="item"><div class="box" style="width:120px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#57534A">badge only</div><div class="tok">pill</div><div class="px">999</div></div>
  </div>
</body></html>
