<!doctype html>
<html><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="_card.css">
<style>
  .row { display: grid; grid-template-columns: 60px 1fr 60px; align-items: center; gap: 16px; margin-bottom: 8px; }
  .token { font-family: var(--font-mono); font-size: 11px; color: var(--fg-secondary); }
  .bar { background: #3C6240; height: 18px; border-radius: 3px; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--fg-tertiary); text-align: right; }
</style></head>
<body>
  <div class="row"><span class="token">space-1</span><div class="bar" style="width:4px"></div><span class="px">4px</span></div>
  <div class="row"><span class="token">space-2</span><div class="bar" style="width:8px"></div><span class="px">8px</span></div>
  <div class="row"><span class="token">space-3</span><div class="bar" style="width:12px"></div><span class="px">12px</span></div>
  <div class="row"><span class="token">space-4</span><div class="bar" style="width:16px"></div><span class="px">16px</span></div>
  <div class="row"><span class="token">space-6</span><div class="bar" style="width:24px"></div><span class="px">24px</span></div>
  <div class="row"><span class="token">space-8</span><div class="bar" style="width:32px"></div><span class="px">32px</span></div>
  <div class="row"><span class="token">space-12</span><div class="bar" style="width:48px"></div><span class="px">48px</span></div>
  <div class="row"><span class="token">space-16</span><div class="bar" style="width:64px"></div><span class="px">64px</span></div>
  <div class="row"><span class="token">space-24</span><div class="bar" style="width:96px"></div><span class="px">96px</span></div>
</body></html>
