<!doctype html>
<html><head><meta charset="utf-8"><title>Display type</title>
<link rel="stylesheet" href="_card.css">
<style>
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .row { display: grid; grid-template-columns: 80px 1fr; gap: 18px; align-items: baseline; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--fg-tertiary); padding-top: 6px; }
  .meta strong { display:block; color: var(--fg-secondary); font-size: 11px; font-weight: 600; }
  .spec { color: var(--fg-primary); letter-spacing: -0.025em; font-weight: 700; line-height: 1; font-family: var(--font-display); }
</style></head>
<body>
  <div class="stack">
    <div class="row">
      <div class="meta"><strong>Display</strong>60 / 1.0</div>
      <div class="spec" style="font-size:60px">Hired, faster.</div>
    </div>
    <div class="row">
      <div class="meta"><strong>H1</strong>48 / 1.0</div>
      <div class="spec" style="font-size:48px;font-weight:700">Build a CV worth reading.</div>
    </div>
    <div class="row">
      <div class="meta"><strong>H2</strong>38 / 1.1</div>
      <div class="spec" style="font-size:38px;font-weight:600">Your AI career copilot</div>
    </div>
  </div>
</body></html>
