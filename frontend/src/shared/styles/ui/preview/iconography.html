<!doctype html>
<html><head><meta charset="utf-8"><title>Iconography</title>
<link rel="stylesheet" href="_card.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body { padding: 22px 24px; }
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 14px 12px; }
  .ico { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .ico svg { width: 22px; height: 22px; stroke: #1B1A16; stroke-width: 1.75; }
  .ico .l { font-family: var(--font-mono); font-size: 9px; color: var(--fg-tertiary); }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-tertiary); font-weight: 600; margin-bottom: 12px; }
</style></head>
<body>
  <div class="label">Lucide · 1.75 stroke · brand-aligned subset</div>
  <div class="grid">
    <div class="ico"><i data-lucide="file-text"></i><span class="l">resume</span></div>
    <div class="ico"><i data-lucide="sparkles"></i><span class="l">ai</span></div>
    <div class="ico"><i data-lucide="briefcase"></i><span class="l">job</span></div>
    <div class="ico"><i data-lucide="search"></i><span class="l">search</span></div>
    <div class="ico"><i data-lucide="target"></i><span class="l">match</span></div>
    <div class="ico"><i data-lucide="message-square"></i><span class="l">chat</span></div>
    <div class="ico"><i data-lucide="mic"></i><span class="l">mic</span></div>
    <div class="ico"><i data-lucide="play"></i><span class="l">play</span></div>
    <div class="ico"><i data-lucide="check-circle-2"></i><span class="l">check</span></div>
    <div class="ico"><i data-lucide="alert-triangle"></i><span class="l">warn</span></div>

    <div class="ico"><i data-lucide="download"></i><span class="l">download</span></div>
    <div class="ico"><i data-lucide="upload"></i><span class="l">upload</span></div>
    <div class="ico"><i data-lucide="settings"></i><span class="l">settings</span></div>
    <div class="ico"><i data-lucide="bell"></i><span class="l">notify</span></div>
    <div class="ico"><i data-lucide="user"></i><span class="l">user</span></div>
    <div class="ico"><i data-lucide="bookmark"></i><span class="l">save</span></div>
    <div class="ico"><i data-lucide="building-2"></i><span class="l">company</span></div>
    <div class="ico"><i data-lucide="map-pin"></i><span class="l">loc</span></div>
    <div class="ico"><i data-lucide="dollar-sign"></i><span class="l">pay</span></div>
    <div class="ico"><i data-lucide="arrow-right"></i><span class="l">next</span></div>
  </div>
  <script>lucide.createIcons();</script>
</body></html>
