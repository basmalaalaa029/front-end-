<!doctype html>
<html><head>
<meta charset="utf-8">
<title>CareerPilot · Interview Sim</title>
<link rel="stylesheet" href="../_shared/app.css">
<link rel="stylesheet" href="sim.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../_shared/AppChrome.jsx"></script>
<script type="text/babel" src="SimComponents.jsx"></script>
<script type="text/babel">
const TRANSCRIPT = [
  { who: "ai", text: "Thanks for joining, Maya. Let's start with your work at Square — walk me through a project where you had to push back on a PM." },
  { who: "me", text: "Sure. So on checkout, we were planning a six-week sprint to ship a redesign. The PM wanted to launch all surfaces at once — web, mobile, in-app." },
  { who: "ai", text: "And what did you propose instead?" },
  { who: "me", text: "I pushed for shipping web first, learning, then porting. We landed at a phased rollout. The first surface alone cut drop-off 38%, which built the case for the rest." },
];

function App() {
  const [listening, setListening] = React.useState(true);
  return (
    <div className="app">
      <AppSidebar active="sim" />
      <div className="app-main">
        <AppHeader
          title="Interview Sim"
          sub="Behavioral round · Senior PD"
          right={<>
            <button className="btn btn-secondary"><Icon name="pause" size={14} stroke={2}/>Pause</button>
            <button className="btn btn-primary"><Icon name="square" size={14} stroke={2}/>End session</button>
          </>}
        />
        <div className="sim-layout">
          <div className="sim-stage">
            <InterviewerCard
              role="Recruiter · simulated"
              name="Elena Chen"
              sub="Hiring manager voice. I'll ask you 8 behavioral questions over ~25 minutes."
              time="12:24"
            />
            <QuestionCard
              num={3} total={8}
              question="Tell me about a time you disagreed with a product manager. How did you resolve it?"
              tag="Behavioral · Collaboration"
            />
            <Transcript entries={TRANSCRIPT} />
            <MicBar listening={listening} />
          </div>
          <div className="sim-side">
            <FeedbackPanel />
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body></html>
